name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # This project requires Xcode 26+ (see README Requirements). Pin an exact
          # version here if `latest-stable` ever resolves below that floor.
          xcode-version: latest-stable

      - name: Cache SwiftPM dependency sources
        uses: actions/cache@v4
        with:
          # Package.resolved isn't committed (swift-build/swift-tools-protocols float
          # on `branch: main`), so it always hashes to the same empty match — key off
          # Package.swift instead. Cache only fetched sources, not .build's compiled
          # objects, so a stale cache can't silently serve outdated build products
          # across dependency or toolchain changes; sources just get an incremental
          # `git fetch` instead of a full clone.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.63.3" # keep in sync with the version contributors install locally
        run: |
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o swiftlint.zip
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint-bin"
          chmod +x "$RUNNER_TEMP/swiftlint-bin/swiftlint"
          echo "$RUNNER_TEMP/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint
